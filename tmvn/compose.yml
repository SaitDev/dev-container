services:
  tmvn-java21:
    build:
      context: ..
      dockerfile: java21-sshd/Dockerfile
    image: java21-sshd:latest
    container_name: ${PROJECT}-java21
#    restart: unless-stopped
    environment:
      SSH_USER: dev
      DOCKER_HOST: unix:///var/run/dind/docker.sock
      VSCODE_CLI_USE_FILE_KEYCHAIN: "1"
      VSCODE_CLI_DATA_DIR: /home/dev/.vscode
    networks:
      - dev-dind
    ports:
      - "2233:22"
      - "25588:25577"
      - "25565:25565"
    volumes:
      - maven:/home/dev/.m2
      - gradle:/home/dev/.gradle
      - dind-runtime:/var/run/dind
      - vscode:/home/dev/.vscode
      - type: bind
        source: ${WORKSPACE_RESOURCE:-.}/ssh/authorized_keys
        target: /home/dev/.ssh/shared/authorized_keys
        read_only: true
        bind:
          create_host_path: false
      - "${WORKSPACE_RESOURCE:-.}/intellij-workspace:/workspace"
      - type: bind
        source: "${WORKSPACE1_SOURCE_FOLDER:-.}"
        target: "/workspace/${WORKSPACE1_TARGET_FOLDER}"
        bind:
          create_host_path: false
      - type: bind
        source: "${WORKSPACE2_SOURCE_FOLDER:-.}"
        target: "/workspace/${WORKSPACE2_TARGET_FOLDER}"
        bind:
          create_host_path: false
      - "${WORKSPACE_RESOURCE:-.}/codex:/home/dev/.codex"
      - "${WORKSPACE_RESOURCE:-.}/jetbrains-config:/home/dev/.config/JetBrains"
      - "${WORKSPACE_RESOURCE:-.}/jetbrains-cache:/home/dev/.cache/JetBrains"
      - "${WORKSPACE_RESOURCE:-.}/jetbrains-share:/home/dev/.local/share/JetBrains"

volumes:
  maven:
    name: "${PROJECT}-maven"
  gradle:
    name: "${PROJECT}-gradle"
  vscode:
    name: "${PROJECT}-vscode"
  dind-runtime:
    external: true

networks:
  dev-dind:
    external: true
